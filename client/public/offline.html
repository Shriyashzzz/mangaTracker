<!doctype html>
<!--
  What the installed app shows when a page is opened with no network at all
  (public/sw.js). Plain HTML with its styles inside: with no network the
  app's own code may not be there to draw anything. Its look copies the
  sign-in spread (components/authArt): an art panel with speed lines and a
  speech bubble, beside a card.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta
      name="theme-color"
      content="#f3eee2"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#16140f"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>You're offline · Manga Tracker</title>

    <style>
      /* the site's own lettering, kept with this page by the service worker
         (public/sw.js), so it shows with no signal */
      @font-face {
        font-family: Bangers;
        src: url(/fonts/bangers-latin.woff2) format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Comic Neue";
        font-weight: 700;
        src: url(/fonts/comic-neue-700-latin.woff2) format("woff2");
        font-display: swap;
      }
      :root {
        --paper: #f3eee2;
        --card: #fbf8f0;
        --ink: #1d1a16;
        --ink-soft: #4a443b;
        --line: #1d1a16;
        --line-soft: #d6ccb7;
        --accent: #b14a3c;
        --on-accent: #fbf8f0;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #16140f;
          --card: #1c1914;
          --ink: #eee6d4;
          --ink-soft: #c8bfab;
          --line: #cfc5ae;
          --line-soft: #3a3429;
          --accent: #d27a66;
          --on-accent: #16140f;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--paper);
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(0.75rem, 3vw, 2rem);
        color: var(--ink);
        font:
          400 1rem/1.5 "IBM Plex Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      /* the shouty lettering: Bangers if the phone has it saved, else Impact */
      .brand {
        font-family: Bangers, Impact, "Arial Black", sans-serif;
        letter-spacing: 0.03em;
      }
      .spread {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1fr);
        gap: 12px;
        width: 100%;
        max-width: 760px;
        padding: 12px;
        background: var(--card);
        border: 1.5px solid var(--line-soft);
      }
      .art {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 380px;
        overflow: hidden;
        background: var(--paper);
        border: 3px solid var(--line);
      }
      .lines {
        flex: 1;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at 50% 50%,
            var(--paper) 0 22%,
            transparent 64%
          ),
          repeating-conic-gradient(
            from 0deg at 50% 50%,
            var(--line) 0deg 0.7deg,
            transparent 0.7deg 6deg
          );
      }
      .sfx {
        max-width: 84%;
        padding: 0.12em 0.3em;
        background: var(--paper);
        transform: rotate(-5deg);
        font-size: clamp(2.6rem, 6vw, 3.6rem);
        line-height: 0.95;
        text-align: center;
        text-transform: uppercase;
        color: var(--accent);
        -webkit-text-stroke: 1.5px var(--line);
        paint-order: stroke fill;
      }
      .bubble {
        position: relative;
        margin: 0 1.1rem 1.25rem;
        padding: 1.1rem 2rem;
        background: var(--card);
        border: 2.5px solid var(--line);
        border-radius: 48% 52% 50% 50% / 56% 52% 48% 44%;
        text-align: center;
        text-transform: uppercase;
        font:
          700 0.9rem/1.35 "Comic Neue",
          "Comic Sans MS",
          "Chalkboard SE",
          cursive;
        letter-spacing: 0.02em;
      }
      /* the bubble's tail, pointing up at the lettering */
      .bubble::before,
      .bubble::after {
        content: "";
        position: absolute;
        right: 30%;
        border-style: solid;
        border-color: transparent transparent var(--line);
      }
      .bubble::before {
        top: -19px;
        border-width: 0 9px 19px 9px;
      }
      .bubble::after {
        top: -14px;
        right: calc(30% + 3px);
        border-width: 0 6px 14px 6px;
        border-bottom-color: var(--card);
      }
      .card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(1.5rem, 4vw, 2.5rem);
        background: var(--paper);
        border: 3px solid var(--line);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.2rem, 5vw, 2.8rem);
        font-weight: 400;
        line-height: 1;
        text-transform: uppercase;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--ink-soft);
      }
      button {
        min-height: 48px;
        width: 100%;
        border: 2px solid var(--line);
        background: var(--accent);
        color: var(--on-accent);
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        box-shadow: 3px 3px 0 var(--line);
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--line);
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      /* phones: the art becomes a short strip above the card */
      @media (max-width: 720px) {
        .spread {
          grid-template-columns: minmax(0, 1fr);
          max-width: 460px;
          gap: 9px;
          padding: 9px;
        }
        .art {
          min-height: 0;
        }
        .lines {
          flex: none;
          height: 118px;
        }
        .sfx {
          font-size: 2.6rem;
          transform: rotate(-3deg);
        }
        .bubble {
          margin: 0 0.8rem 0.9rem;
          padding: 0.85rem 1.5rem;
          font-size: 0.8rem;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .spread {
          animation: in 240ms ease-out;
        }
        @keyframes in {
          from {
            opacity: 0;
            transform: translateY(6px);
          }
        }
      }
    </style>
  </head>
  <body>
    <main class="spread">
      <div class="art" aria-hidden="true">
        <div class="lines"><span class="sfx brand">Offline!</span></div>
        <p class="bubble">The signal dropped.</p>
      </div>
      <div class="card">
        <h1 class="brand">You're offline</h1>
        <p>Your shelf is safe. It'll be right here once you're back online.</p>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
