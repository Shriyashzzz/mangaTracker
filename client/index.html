<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compare US manga prices across stores for every volume, and track the chapter you're on in every series you read."
    />
    <meta
      name="theme-color"
      content="#f3eee2"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#16140f"
      media="(prefers-color-scheme: dark)"
    />
    <title>Manga Tracker: compare US manga prices</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manga Tracker" />
    <meta
      property="og:title"
      content="Manga Tracker: compare US manga prices"
    />
    <meta
      property="og:description"
      content="Compare US manga prices across stores for every volume, and track the chapter you're on in every series you read."
    />
    <meta name="twitter:card" content="summary" />
    <!-- the site itself, and its search, for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Manga Tracker",
        "url": "https://mangatracker.xyz/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://mangatracker.xyz/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!-- Impact (Walmart affiliate): turns Walmart links into affiliate links -->
    <script type="text/javascript">
      (function (i, m, p, a, c, t) {
        c.ire_o = p;
        c[p] =
          c[p] ||
          function () {
            (c[p].a = c[p].a || []).push(arguments);
          };
        t = a.createElement(m);
        var z = a.getElementsByTagName(m)[0];
        t.async = 1;
        t.src = i;
        z.parentNode.insertBefore(t, z);
      })(
        "https://utt.impactcdn.com/P-A8046241-1354-4360-9bfe-335c42817f551.js",
        "script",
        "impactStat",
        document,
        window,
      );
      impactStat("transformLinks");
      impactStat("trackImpression");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@500&family=Comic+Neue:wght@700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- only the two glyphs of the background sound effect -->
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&text=%E3%83%89%E3%83%B3&display=swap"
      rel="stylesheet"
    />
    <script>
      // apply the saved theme and background before first paint so there is no flash
      document.documentElement.dataset.bg = "sfx";
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
        const bg = localStorage.getItem("bg");
        if (["sfx", "ink", "pages", "panels"].includes(bg)) {
          document.documentElement.dataset.bg = bg;
        }
      } catch {
        /* storage unavailable, fall back to system preference */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
