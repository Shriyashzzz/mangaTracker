<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- installing the site as an app (public/manifest.webmanifest) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Manga Tracker" />
    <!-- viewport-fit=cover: the installed app on an iPhone draws under the
         home indicator, so the bottom bar (padded by the safe-area inset)
         fills that strip instead of iOS painting it white -->
    <!-- the text follows the phone's own font size (Android's Settings,
         Display, Font size), as an app's should -->
    <meta name="text-scale" content="scale" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Compare US manga prices across stores, track the chapters you've read in every series, and see which ones have new volumes out."
    />
    <meta
      name="theme-color"
      content="#f3eee2"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#16140f"
      media="(prefers-color-scheme: dark)"
    />
    <title>Manga Tracker: compare US manga prices</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manga Tracker" />
    <meta
      property="og:title"
      content="Manga Tracker: compare US manga prices"
    />
    <meta
      property="og:description"
      content="Compare US manga prices across stores, track the chapters you've read in every series, and see which ones have new volumes out."
    />
    <meta name="twitter:card" content="summary" />
    <!-- the site itself, for search engines: its name in results. (No
         SearchAction: Google retired the sitelinks search box, and its
         template address got crawled as a duplicate page) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Manga Tracker",
        "url": "https://mangatracker.xyz/"
      }
    </script>
    <!-- no Impact script for now: it only turns Walmart links into
         affiliate links, and Walmart stays hidden until Impact approves us.
         Put it back from git history then (server/src/prices/stores/
         affiliates.ts, WALMART_AFFILIATE) -->
    <!-- the fonts come with the app's own files (src/index.css, @font-face) -->
    <!-- the backdrop stays hidden until the stylesheet is in (styles/
         backdrop.css shows it): in development the CSS arrives after the
         first paint, and its "ドン" would show as bare text -->
    <style>
      .backdrop {
        visibility: hidden;
      }
      /* the page's paper before the stylesheet is in, so the first paint
         isn't white (in development, or in dark mode). The same colours
         as --paper in src/index.css */
      html {
        background: #f3eee2;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background: #16140f;
        }
      }
      html[data-theme="dark"] {
        background: #16140f;
      }
      /* on the way to the shelf (the script below): the price page's text
         for search engines never shows */
      html.shelf-start .crawl-page {
        display: none;
      }
    </style>
    <!-- the background sound effect's font, only its two glyphs (ド, ン:
         Dela Gothic One, SIL Open Font License), inlined so ドン is drawn
         in it from the first paint, without waiting for Google Fonts -->
    <style>
      @font-face {
        font-family: "Dela Gothic One";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url(data:font/woff2;base64,d09GMgABAAAAAAOEABAAAAAABsQAAAMvAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGhQbHhwuBmAATBEICoMAgkYLDgABNgIkAxgEIAWEKAcgFyQYDhtlBcgEHvg86/0kxdgZyYti5c6KOoE8CTqJtWw5/QiH0OSUwar/oS6lNEdwpTRlQShwtVsUxiFUN46gCl3pTtQzGQHYI7oFGmjl4iZb/PFHlFXUGdCj1Nmt1g6QJXHEIU/37jpyUB/c+3Qe0g/3xpqO42X5gliABqRZUivS1QZxogMpIo6cGkyvrNeRxpm/uNhQ20ARatIXeYB1BigzhKpKYhUTlvylO5pHRU5hkEB6903z8CpkbW+6HgkJNWll0vmkL1tBIjpXYH1+tc/VnKsunZVmokBYrdiSVuvhUjg7akf6bR20CoPFcE2/SkJSZNnJSat1tdVq7TQuyqjhjn2HOP25ZbjTRbK/+1A4cPu5MZ1oumMy3zYamOvu3imZfdd89675/G3jrVuGW88Mljt3TKfuJt6+bezQqO2EP9bvzd436QPGLHJd/MdznbqenIVDQ5s8DJerPTILfLWbpMa/zlcnO2UVTgorv68RFqfyKEOjd1i1e+PhHNf6iLpG78gGlxp6V8f0W3nsa5I5szHFfMp50f4hgQY3ryNT3g5ubqn2aLzkGrp8dPzy2Om+nzqPsIwNOV3cLZpNmUEj8kZOiCwYGjQmrm3QyLwREyILhgaNAQABNglReebE9uqOTnnf9Hbyu7LIo+lOBm3s46gpuf+u/n+ms1XGQat7QtmAkDLj/zMMdVny7+q/Mzrbx4E5Xyu/w49zIL9joBSzhf/NO42m5Rd+dEA3RKtkPXp6vCFmxYbx7xTuCQ9/IN/BJBx5x8NfxGYwhQRGMQ2+dGJaYsggR349NDGEIQxgMDkkksjndmUQPRnAEE2cwGDqg1v2ZxAWEmmkgjrK6E4fOlNJf4bQRE+60kg/uhNPC95rYWhTdBAmugMTUH9appJMAkkkka72qoJeFaSpVUMeVS7FGKilgdwt1Mm0sGxiKf0ZwMgr0Foux62SQnBIhbZpa00Nn9aMQfSnF93pOshbzNAGXF7/wahEXTdZGDROG0oXEuhKf/o+wrdH0pneDGUU3elH4kG10d+1IA20HiAFc79wRnz9by+/k9/9//w/WFnwR6xCrpDfMUsewETOM48A)
          format("woff2");
        unicode-range: U+3099, U+30C8-30C9, U+30F3;
      }
    </style>
    <script>
      // someone who has signed in on this device and opens "/" came for
      // their shelf: go there before anything is drawn, so neither the
      // search engines' price text nor the Prices tab shows first. The note
      // is store/auth.ts's; without it pages/Prices/FrontDoor.tsx decides
      // once the sign-in check answers. A shared search (?q=) keeps its search
      try {
        if (
          location.pathname === "/" &&
          !new URLSearchParams(location.search).has("q") &&
          localStorage.getItem("signedInBefore") === "yes"
        ) {
          history.replaceState(
            history.state,
            "",
            "/shelf" + location.search + location.hash,
          );
          document.documentElement.classList.add("shelf-start");
        }
      } catch {
        /* storage unavailable: FrontDoor decides */
      }
    </script>
    <script>
      // apply the saved theme and background before first paint so there is no flash
      document.documentElement.dataset.bg = "sfx";
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
        const bg = localStorage.getItem("bg");
        if (["sfx", "ink", "pages", "panels"].includes(bg)) {
          document.documentElement.dataset.bg = bg;
        }
      } catch {
        /* storage unavailable, fall back to system preference */
      }
    </script>
  </head>
  <body>
    <!-- the decoration behind every page, here rather than in React so it is
         drawn with the first paint. Which piece shows is picked by
         <html data-bg> (set above) in src/styles/backdrop.css -->
    <div class="backdrop" aria-hidden="true">
      <span class="backdrop-sfx">ドン</span>
      <span class="backdrop-panel"></span>
      <span class="backdrop-panel"></span>
      <span class="backdrop-panel"></span>
      <span class="backdrop-panel"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
